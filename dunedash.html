<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dune Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A0F28;
    --cream:#FFE9C9;
    --sand:#E8C07D;
    --rust:#E4572E;
    --gold:#FFD34E;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(120% 80% at 50% 0%, #33204A 0%, var(--ink) 60%, #0E0818 100%);
    color:var(--cream);
    font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
    touch-action:manipulation;
  }
  #shell{width:min(960px,100%);display:flex;flex-direction:column;gap:12px}
  #stage{
    position:relative;
    width:100%;
    aspect-ratio:480/272;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 0 0 3px #2E1B45, 0 24px 60px -20px #000;
  }
  canvas{
    display:block;width:100%;height:100%;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  /* HUD */
  #hud{
    position:absolute;inset:8px 10px auto 10px;
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:clamp(11px,1.7vw,15px);
    letter-spacing:.02em;
    text-shadow:0 2px 0 rgba(26,15,40,.85);
    pointer-events:none;
  }
  #hud b{font-weight:800;color:var(--gold)}
  /* Overlays */
  #overlay{
    position:absolute;inset:0;
    display:grid;place-content:center;
    gap:14px;
    text-align:center;
    padding:6% 8%;
    background:rgba(20,10,32,.72);
    backdrop-filter:blur(2px);
  }
  #overlay.hidden{display:none}
  #overlay h1{
    margin:0;
    font-weight:800;
    font-size:clamp(28px,6.2vw,58px);
    line-height:.92;
    letter-spacing:-.03em;
    color:var(--sand);
  }
  #overlay h1 span{display:block;color:var(--rust)}
  #overlay p{
    margin:0 auto;max-width:42ch;
    font-size:clamp(12px,1.9vw,16px);
    font-weight:600;line-height:1.5;
    color:#E4CDAE;
  }
  kbd{
    font:inherit;font-weight:800;
    background:#33204A;border:1px solid #4B3268;
    border-bottom-width:3px;
    border-radius:4px;padding:1px 6px;color:var(--cream);
  }
  button{
    font:inherit;font-weight:800;
    font-size:clamp(13px,2vw,17px);
    color:var(--ink);background:var(--sand);
    border:0;border-radius:4px;
    padding:.6em 1.4em;
    cursor:pointer;
    justify-self:center;
    box-shadow:0 4px 0 #B4793F;
  }
  button:hover{background:#F3CE8E}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #B4793F}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  /* Touch pad */
  #pad{display:none;justify-content:space-between;gap:10px}
  #pad .side{display:flex;gap:10px}
  #pad div[role=button]{
    flex:1;min-width:74px;
    display:grid;place-content:center;
    padding:18px 22px;
    border-radius:6px;
    background:#2E1B45;color:var(--cream);
    font-weight:800;font-size:20px;
    box-shadow:0 4px 0 #1F1230;
  }
  #pad div[role=button].on{background:#4B3268;transform:translateY(2px);box-shadow:0 2px 0 #1F1230}
  body.touch #pad{display:flex}
  #note{
    font-size:12px;color:#8E7AA6;text-align:center;
    letter-spacing:.02em;
  }
  @media (max-width:560px){ #note{display:none} }
</style>
</head>
<body>
<div id="shell">
  <div id="stage">
    <canvas id="game" width="480" height="272" aria-label="Dune Dash platform game"></canvas>
    <div id="hud">
      <div>Sun coins <b id="coins">0</b>/<span id="total">0</span></div>
      <div>Lives <b id="lives">3</b></div>
    </div>
    <div id="overlay">
      <h1>Dune<span>Dash</span></h1>
      <p>You are a fennec fox crossing the mesas at dusk. Collect sun coins, land on scarabs to flatten them, and reach the flag.</p>
      <p><kbd>←</kbd> <kbd>→</kbd> to run · <kbd>Space</kbd> to jump · hold jump to go higher</p>
      <button id="start">Start running</button>
    </div>
  </div>

  <div id="pad">
    <div class="side">
      <div role="button" data-key="left" aria-label="Run left">←</div>
      <div role="button" data-key="right" aria-label="Run right">→</div>
    </div>
    <div class="side">
      <div role="button" data-key="jump" aria-label="Jump">Jump</div>
    </div>
  </div>
  <p id="note">Press <kbd>R</kbd> to restart the level.</p>
</div>

<script>
(() => {
  "use strict";

  // ---------- constants ----------
  const TS = 16;                 // tile size
  const VW = 480, VH = 272;      // view size in pixels (30 x 17 tiles)
  const GRAVITY = 0.5;
  const MAX_FALL = 9;
  const RUN_ACC = 0.55;
  const RUN_MAX = 2.9;
  const FRICTION = 0.3;
  const JUMP_V = -7.2;
  const CUT_V = -3;              // velocity cap when jump is released early
  const COYOTE = 6;              // frames of grace after leaving ground
  const BUFFER = 8;              // frames a jump press stays queued

  const COL = {
    skyTop:"#2E1B45", skyMid:"#8E3C64", skyLow:"#E9915A",
    sun:"#FFD9A0", mesaFar:"#5A3060", mesaNear:"#7E3F62", dune:"#C4693F",
    sandTop:"#E8C07D", sandBody:"#A9713C", sandDark:"#70401F",
    ink:"#221033", cream:"#FFE9C9", rust:"#E4572E",
    gold:"#FFD34E", goldDark:"#D99A1F",
    shell:"#2F5E5A", shellLight:"#6FD8C0",
    flag:"#E4572E", pole:"#3E2650"
  };

  // ---------- level ----------
  // . empty   # ground   = platform   o coin   e scarab   ^ spike   p start   F flag
  const SRC = [
    "....................................................................................................",
    "....................................................................................................",
    "....................................................................................................",
    "....................................................................................................",
    "....................................................................................................",
    "....................................................................................................",
    "....................................................................................................",
    "....................................................................................................",
    "....................................................................................................",
    "............................oooo..................ooo...............................................",
    "............................====..................===...............................................",
    "............ooo.......oooo..................oooo.............ooo...........oooo.....................",
    "............===.......====..................====.............===...........====.....................",
    "......ooo........ooo...............................................................ooo..............",
    "..p.......................e......e........^...e........e.^........e.#######.....e.......e.....F.....",
    "#################...#########################################...####################################",
    "#################...#########################################...####################################"
  ];

  const W = Math.max(...SRC.map(r => r.length));
  const H = SRC.length;
  const grid = SRC.map(r => r.padEnd(W, ".").split(""));

  const spawn = {x:2*TS, y:13*TS};
  let coinSeed = [], enemySeed = [], spikes = [], goal = null;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const c = grid[y][x];
      if (c === "p") { spawn.x = x*TS; spawn.y = y*TS; grid[y][x] = "."; }
      else if (c === "o") { coinSeed.push({x:x*TS+8, y:y*TS+8}); grid[y][x] = "."; }
      else if (c === "e") { enemySeed.push({x:x*TS+2, y:y*TS+4}); grid[y][x] = "."; }
      else if (c === "^") { spikes.push({x:x*TS, y:y*TS+6, w:TS, h:10}); grid[y][x] = "."; }
      else if (c === "F") { goal = {x:x*TS+4, y:y*TS-16, w:10, h:32}; grid[y][x] = "."; }
    }
  }
  const LEVEL_W = W*TS, LEVEL_H = H*TS;
  const solid = (tx,ty) => {
    if (tx < 0 || tx >= W) return true;     // walls at both ends
    if (ty < 0 || ty >= H) return false;    // open sky, open pit
    const c = grid[ty][tx];
    return c === "#" || c === "=";
  };

  // cactus decoration: fixed spots that sit on the ground row
  const cacti = [8, 28, 44, 52, 86, 93].filter(c => solid(c, 15)).map(c => ({x:c*TS, y:15*TS}));

  // ---------- state ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  const ui = {
    overlay: document.getElementById("overlay"),
    coins: document.getElementById("coins"),
    total: document.getElementById("total"),
    lives: document.getElementById("lives"),
    start: document.getElementById("start")
  };

  const player = {
    x:0, y:0, w:11, h:14, vx:0, vy:0,
    face:1, onGround:false, coyote:0, jumpBuf:0, held:false,
    anim:0, dead:0, squash:0
  };

  let coins = [], enemies = [], cam = 0, lives = 3, picked = 0;
  let mode = "title";            // title | play | dead | over | win
  let shake = 0, flagRise = 0, t = 0;

  ui.total.textContent = coinSeed.length;

  function resetPlayer() {
    player.x = spawn.x; player.y = spawn.y;
    player.vx = 0; player.vy = 0;
    player.face = 1; player.dead = 0; player.squash = 0;
    player.onGround = false; player.coyote = 0; player.jumpBuf = 0;
    cam = 0;
  }

  function loadLevel(fullReset) {
    coins = coinSeed.map(c => ({...c, taken:false}));
    enemies = enemySeed.map(e => ({x:e.x, y:e.y, w:12, h:11, vx:-0.7, squished:0}));
    if (fullReset) { lives = 3; picked = 0; }
    flagRise = 0;
    resetPlayer();
    syncHud();
  }

  function syncHud() {
    ui.coins.textContent = picked;
    ui.lives.textContent = lives;
  }

  function showOverlay(html) {
    ui.overlay.innerHTML = html;
    ui.overlay.classList.remove("hidden");
    const b = ui.overlay.querySelector("button");
    if (b) { b.addEventListener("click", startGame); b.focus(); }
  }

  function startGame() {
    ui.overlay.classList.add("hidden");
    loadLevel(true);
    mode = "play";
  }

  // ---------- input ----------
  const keys = {left:false, right:false, jump:false};
  const MAP = {
    ArrowLeft:"left", KeyA:"left",
    ArrowRight:"right", KeyD:"right",
    Space:"jump", ArrowUp:"jump", KeyW:"jump", KeyZ:"jump"
  };

  addEventListener("keydown", e => {
    if (e.code === "KeyR" && mode !== "title") { loadLevel(true); mode = "play"; ui.overlay.classList.add("hidden"); }
    if ((e.code === "Space" || e.code === "Enter") && mode === "title") { startGame(); e.preventDefault(); return; }
    const k = MAP[e.code];
    if (!k) return;
    e.preventDefault();
    if (k === "jump" && !keys.jump) player.jumpBuf = BUFFER;
    keys[k] = true;
  });
  addEventListener("keyup", e => {
    const k = MAP[e.code];
    if (k) { keys[k] = false; if (k === "jump") player.held = false; }
  });

  // touch pad
  if (matchMedia("(pointer:coarse)").matches) document.body.classList.add("touch");
  document.querySelectorAll("#pad [data-key]").forEach(el => {
    const k = el.dataset.key;
    const on = ev => { ev.preventDefault(); el.classList.add("on"); if (k === "jump" && !keys.jump) player.jumpBuf = BUFFER; keys[k] = true; };
    const off = ev => { ev.preventDefault(); el.classList.remove("on"); keys[k] = false; if (k === "jump") player.held = false; };
    el.addEventListener("pointerdown", on);
    el.addEventListener("pointerup", off);
    el.addEventListener("pointercancel", off);
    el.addEventListener("pointerleave", off);
  });

  // ---------- physics helpers ----------
  function hitsTiles(x, y, w, h) {
    const x0 = Math.floor(x/TS), x1 = Math.floor((x+w-1)/TS);
    const y0 = Math.floor(y/TS), y1 = Math.floor((y+h-1)/TS);
    for (let ty = y0; ty <= y1; ty++)
      for (let tx = x0; tx <= x1; tx++)
        if (solid(tx,ty)) return true;
    return false;
  }

  function moveX(o, dx) {
    o.x += dx;
    if (!hitsTiles(o.x, o.y, o.w, o.h)) return false;
    const step = dx > 0 ? -1 : 1;
    while (hitsTiles(o.x, o.y, o.w, o.h)) o.x += step;
    return true;
  }

  function moveY(o, dy) {
    o.y += dy;
    if (!hitsTiles(o.x, o.y, o.w, o.h)) return false;
    const step = dy > 0 ? -1 : 1;
    while (hitsTiles(o.x, o.y, o.w, o.h)) o.y += step;
    return true;
  }

  const overlap = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

  // ---------- update ----------
  function update() {
    t++;
    if (shake > 0) shake--;

    if (mode === "dead") {
      player.dead++;
      player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);
      player.y += player.vy;
      if (player.dead > 70) {
        if (lives <= 0) {
          mode = "over";
          showOverlay('<h1>The dunes<span>won</span></h1><p>You gathered ' + picked + ' sun coins before the sand took you.</p><button>Try again</button>');
        } else { resetPlayer(); mode = "play"; }
      }
      return;
    }

    if (mode === "win") { flagRise = Math.min(flagRise + 0.06, 1); return; }
    if (mode !== "play") return;

    // horizontal
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir !== 0) {
      player.vx += dir * RUN_ACC;
      player.face = dir;
    } else {
      if (player.vx > 0) player.vx = Math.max(0, player.vx - FRICTION);
      else if (player.vx < 0) player.vx = Math.min(0, player.vx + FRICTION);
    }
    player.vx = Math.max(-RUN_MAX, Math.min(RUN_MAX, player.vx));
    moveX(player, player.vx) && (player.vx = 0);

    // jump
    if (player.jumpBuf > 0) player.jumpBuf--;
    if (player.coyote > 0) player.coyote--;
    if (player.jumpBuf > 0 && player.coyote > 0) {
      player.vy = JUMP_V;
      player.jumpBuf = 0; player.coyote = 0;
      player.onGround = false; player.held = true;
      player.squash = -4;
    }
    if (!keys.jump && player.vy < CUT_V) player.vy = CUT_V;

    // vertical
    player.vy = Math.min(player.vy + GRAVITY, MAX_FALL);
    const landed = moveY(player, player.vy);
    if (landed) {
      if (player.vy > 0) {
        if (!player.onGround) player.squash = Math.min(5, player.vy);
        player.onGround = true; player.coyote = COYOTE;
      }
      player.vy = 0;
    } else {
      player.onGround = false;
    }
    if (player.onGround) player.coyote = COYOTE;
    if (player.squash > 0) player.squash -= 0.6;
    if (player.squash < 0) player.squash += 0.5;

    // run animation
    player.anim += Math.abs(player.vx) * 0.22;

    // enemies
    for (const e of enemies) {
      if (e.squished) { e.squished++; continue; }
      if (moveX(e, e.vx)) e.vx *= -1;
      // turn at ledges
      const ahead = Math.floor((e.x + (e.vx > 0 ? e.w + 1 : -1)) / TS);
      const below = Math.floor((e.y + e.h + 2) / TS);
      if (!solid(ahead, below)) e.vx *= -1;
      e.y += 1;
      if (hitsTiles(e.x, e.y, e.w, e.h)) e.y -= 1;

      if (overlap(player, e)) {
        const fromAbove = player.vy > 0 && (player.y + player.h) - e.y < 9;
        if (fromAbove) {
          e.squished = 1;
          player.vy = -5.4;
          player.jumpBuf = 0;
          player.squash = -3;
          shake = 4;
        } else {
          kill();
          return;
        }
      }
    }
    for (let i = enemies.length - 1; i >= 0; i--)
      if (enemies[i].squished > 26) enemies.splice(i,1);

    // coins
    for (const c of coins) {
      if (c.taken) continue;
      if (Math.abs(c.x - (player.x + player.w/2)) < 11 && Math.abs(c.y - (player.y + player.h/2)) < 12) {
        c.taken = true; picked++; syncHud();
      }
    }

    // spikes
    for (const s of spikes) if (overlap(player, s)) { kill(); return; }

    // pit
    if (player.y > LEVEL_H + 24) { kill(); return; }

    // goal
    if (goal && overlap(player, goal)) {
      mode = "win";
      showOverlay('<h1>Mesa<span>cleared</span></h1><p>' + picked + ' of ' + coinSeed.length +
        ' sun coins collected' + (picked === coinSeed.length ? ' — every last one.' : '.') + '</p><button>Run it again</button>');
    }

    // camera
    const target = player.x + player.w/2 - VW/2;
    cam += (Math.max(0, Math.min(LEVEL_W - VW, target)) - cam) * 0.12;
  }

  function kill() {
    lives--; syncHud();
    mode = "dead";
    player.dead = 1;
    player.vy = -5;
    shake = 10;
  }

  // ---------- drawing ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0,0,0,VH);
    g.addColorStop(0, COL.skyTop);
    g.addColorStop(0.55, COL.skyMid);
    g.addColorStop(1, COL.skyLow);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,VW,VH);

    // stars, upper band only
    ctx.fillStyle = "rgba(255,233,201,.55)";
    for (let i = 0; i < 26; i++) {
      const sx = (i*97 % VW), sy = (i*53 % 80);
      const tw = (t*0.02 + i) % 4 < 2.6 ? 1 : 0;
      if (tw) ctx.fillRect(sx, sy, 1, 1);
    }

    // sun, low and large — the one loud element
    const sx = 352 - cam*0.06, sy = 150;
    ctx.fillStyle = COL.sun;
    ctx.beginPath(); ctx.arc(sx, sy, 34, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(46,27,69,.35)";
    for (let i = 0; i < 5; i++) ctx.fillRect(sx-40, sy - 12 + i*8, 80, 2);
  }

  function drawMesas() {
    // far layer
    ctx.fillStyle = COL.mesaFar;
    const f = -cam*0.22;
    const far = [[-40,168,140,60],[130,150,90,80],[250,176,180,56],[430,146,120,90],[590,170,150,62],[760,154,110,80]];
    for (const [x,y,w,h] of far) {
      const px = ((x + f) % 900 + 900) % 900 - 100;
      ctx.fillRect(px, y, w, h);
      ctx.fillRect(px+10, y-8, w-20, 10);
    }
    // near layer
    ctx.fillStyle = COL.mesaNear;
    const n = -cam*0.45;
    const near = [[-20,196,170,50],[190,206,130,44],[380,192,150,54],[560,208,180,44],[760,198,140,50]];
    for (const [x,y,w,h] of near) {
      const px = ((x + n) % 940 + 940) % 940 - 120;
      ctx.fillRect(px, y, w, h);
      ctx.fillRect(px+14, y-7, w-28, 9);
    }
    // dune band
    ctx.fillStyle = COL.dune;
    ctx.fillRect(0, 232, VW, VH-232);
    ctx.fillStyle = "rgba(34,16,51,.18)";
    ctx.fillRect(0, 232, VW, 3);
  }

  function drawTiles() {
    const x0 = Math.max(0, Math.floor(cam/TS) - 1);
    const x1 = Math.min(W-1, Math.ceil((cam+VW)/TS) + 1);
    for (let tx = x0; tx <= x1; tx++) {
      for (let ty = 0; ty < H; ty++) {
        const c = grid[ty][tx];
        if (c !== "#" && c !== "=") continue;
        const px = Math.round(tx*TS - cam), py = ty*TS;
        const openAbove = !solid(tx, ty-1);

        ctx.fillStyle = COL.sandBody;
        ctx.fillRect(px, py, TS, TS);
        if (openAbove) {
          ctx.fillStyle = COL.sandTop;
          ctx.fillRect(px, py, TS, 4);
          ctx.fillStyle = "rgba(255,233,201,.35)";
          ctx.fillRect(px, py, TS, 1);
        }
        // grain
        ctx.fillStyle = COL.sandDark;
        ctx.fillRect(px+3, py+8, 2, 2);
        ctx.fillRect(px+10, py+12, 3, 2);
        if (c === "=") { ctx.fillRect(px, py+TS-2, TS, 2); }
        // edge shading
        if (!solid(tx+1, ty)) ctx.fillRect(px+TS-2, py+4, 2, TS-4);
        if (!solid(tx-1, ty)) ctx.fillRect(px, py+4, 2, TS-4);
      }
    }
  }

  function drawCactus(c) {
    const px = Math.round(c.x - cam), py = c.y;
    ctx.fillStyle = "#3F6B4A";
    ctx.fillRect(px+6, py-20, 5, 20);
    ctx.fillRect(px+2, py-14, 4, 3);
    ctx.fillRect(px+2, py-17, 3, 5);
    ctx.fillRect(px+11, py-11, 4, 3);
    ctx.fillRect(px+13, py-15, 3, 6);
    ctx.fillStyle = "#5C9163";
    ctx.fillRect(px+6, py-20, 2, 20);
  }

  function drawSpike(s) {
    const px = Math.round(s.x - cam), py = s.y;
    ctx.fillStyle = COL.ink;
    for (let i = 0; i < 4; i++) {
      const bx = px + i*4;
      ctx.beginPath();
      ctx.moveTo(bx, py+10); ctx.lineTo(bx+2, py); ctx.lineTo(bx+4, py+10);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#6B5A80";
    for (let i = 0; i < 4; i++) ctx.fillRect(px + i*4 + 1, py+3, 1, 6);
  }

  function drawCoin(c) {
    const px = Math.round(c.x - cam), py = Math.round(c.y + Math.sin(t*0.09 + c.x*0.1)*1.6);
    const wob = Math.abs(Math.cos(t*0.06 + c.x*0.05));
    const rw = 3 + wob*3;
    ctx.fillStyle = COL.goldDark;
    ctx.beginPath(); ctx.ellipse(px, py, rw+1, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.ellipse(px, py, rw, 5, 0, 0, Math.PI*2); ctx.fill();
    if (rw > 4) { ctx.fillStyle = "rgba(255,255,255,.6)"; ctx.fillRect(px-1, py-3, 2, 3); }
  }

  function drawEnemy(e) {
    const px = Math.round(e.x - cam), py = Math.round(e.y);
    if (e.squished) {
      ctx.fillStyle = COL.shell;
      ctx.fillRect(px, py + e.h - 4, e.w, 4);
      return;
    }
    const legPhase = Math.floor(t/6) % 2;
    ctx.fillStyle = COL.ink;
    ctx.fillRect(px+1, py+e.h-2, 3, 2);
    ctx.fillRect(px+e.w-4, py+e.h-2, 3, 2);
    if (legPhase) { ctx.fillRect(px-1, py+e.h-4, 2, 2); ctx.fillRect(px+e.w-1, py+e.h-4, 2, 2); }
    // shell
    ctx.fillStyle = COL.shell;
    ctx.beginPath(); ctx.ellipse(px+e.w/2, py+6, e.w/2, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = COL.shellLight;
    ctx.fillRect(px+2, py+2, e.w-4, 2);
    ctx.fillStyle = COL.ink;
    ctx.fillRect(px+e.w/2-1, py+1, 2, 10);
    // eyes on the leading side
    const lead = e.vx < 0 ? px+1 : px+e.w-3;
    ctx.fillStyle = COL.cream;
    ctx.fillRect(lead, py+3, 2, 2);
  }

  function drawFlag() {
    if (!goal) return;
    const px = Math.round(goal.x - cam), py = goal.y;
    ctx.fillStyle = COL.pole;
    ctx.fillRect(px+3, py-26, 3, 58);
    const rise = py - 20 - flagRise*22;
    ctx.fillStyle = COL.flag;
    const flap = Math.sin(t*0.12)*2;
    ctx.beginPath();
    ctx.moveTo(px+6, rise);
    ctx.lineTo(px+24 + flap, rise+5);
    ctx.lineTo(px+6, rise+11);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = COL.gold;
    ctx.fillRect(px+6, rise, 18, 1);
  }

  function drawPlayer() {
    const px = Math.round(player.x - cam);
    const sq = Math.max(0, player.squash);
    const st = Math.max(0, -player.squash);
    const h = player.h - sq*0.8 + st*0.8;
    const w = player.w + sq*0.8 - st*0.5;
    const py = Math.round(player.y + (player.h - h));
    const f = player.face;
    const step = player.onGround && Math.abs(player.vx) > 0.4 ? Math.floor(player.anim) % 4 : -1;

    ctx.save();
    ctx.translate(px + player.w/2, py);
    ctx.scale(f, 1);
    ctx.translate(-w/2, 0);

    // tail
    ctx.fillStyle = COL.cream;
    const tw = Math.sin(t*0.15)*1.5;
    ctx.fillRect(-5, h-10 + (step >= 0 ? tw : 0), 5, 4);
    ctx.fillStyle = COL.rust;
    ctx.fillRect(-6, h-10 + (step >= 0 ? tw : 0), 2, 4);

    // legs
    ctx.fillStyle = COL.rust;
    if (step < 0) {
      ctx.fillRect(1, h-3, 3, 3);
      ctx.fillRect(w-4, h-3, 3, 3);
    } else if (step % 2 === 0) {
      ctx.fillRect(0, h-3, 4, 3);
      ctx.fillRect(w-3, h-4, 3, 4);
    } else {
      ctx.fillRect(2, h-4, 3, 4);
      ctx.fillRect(w-5, h-3, 4, 3);
    }

    // body
    ctx.fillStyle = COL.cream;
    ctx.fillRect(0, h-11, w, 8);
    ctx.fillStyle = "#F6D2A4";
    ctx.fillRect(0, h-11, w, 2);

    // head
    ctx.fillStyle = COL.cream;
    ctx.fillRect(w-9, h-17, 9, 7);
    // ears
    ctx.fillRect(w-8, h-21, 3, 5);
    ctx.fillRect(w-4, h-22, 3, 6);
    ctx.fillStyle = COL.rust;
    ctx.fillRect(w-7, h-20, 1, 3);
    ctx.fillRect(w-3, h-21, 1, 4);
    // snout + eye
    ctx.fillStyle = COL.ink;
    ctx.fillRect(w-1, h-13, 2, 2);
    ctx.fillRect(w-5, h-15, 2, 2);

    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-0.5)*shake*0.8, (Math.random()-0.5)*shake*0.6);

    drawSky();
    drawMesas();
    for (const c of cacti) drawCactus(c);
    drawTiles();
    for (const s of spikes) drawSpike(s);
    for (const c of coins) if (!c.taken) drawCoin(c);
    for (const e of enemies) drawEnemy(e);
    drawFlag();
    if (mode !== "over") drawPlayer();

    // dusk vignette
    const v = ctx.createLinearGradient(0,0,0,VH);
    v.addColorStop(0,"rgba(34,16,51,.25)");
    v.addColorStop(0.5,"rgba(34,16,51,0)");
    v.addColorStop(1,"rgba(34,16,51,.28)");
    ctx.fillStyle = v; ctx.fillRect(0,0,VW,VH);

    ctx.restore();
  }

  // ---------- loop ----------
  const STEP = 1000/60;
  let last = performance.now(), acc = 0;

  function frame(now) {
    acc += Math.min(now - last, 200);
    last = now;
    while (acc >= STEP) { update(); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }

  loadLevel(true);
  mode = "title";
  ui.start.addEventListener("click", startGame);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
