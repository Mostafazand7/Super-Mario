name: Deploy to SSH server

on:
  push:
    branches:
      - main
      - claude/great-franklin-lxjopi
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          sed -i \
            -e "s|__SUPABASE_URL__|${SUPABASE_URL}|g" \
            -e "s|__SUPABASE_ANON_KEY__|${SUPABASE_ANON_KEY}|g" \
            dunedash.html

      - name: Prepare index.html
        run: cp dunedash.html index.html

      - name: Copy dunedash.html over SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "dunedash.html"
          target: ${{ secrets.SSH_TARGET_PATH }}
          strip_components: 0

      - name: Copy game as index.html over SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "index.html"
          target: ${{ secrets.SSH_TARGET_PATH }}
          strip_components: 0

      - name: Copy assets (images, sfx) over SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "assets"
          target: ${{ secrets.SSH_TARGET_PATH }}
          strip_components: 0
